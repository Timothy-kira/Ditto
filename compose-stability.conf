// Read-only collection interfaces are inferred unstable because an implementation could
// mutate. Every collection this app passes into a composable is a snapshot rebuilt on
// change, so comparing by value lets the wide screens (SettingsScreen /
// ConversationScreen) skip instead of recomposing whenever a caller happens to allocate a
// new list with equal contents.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection
kotlin.Pair
kotlin.Triple
